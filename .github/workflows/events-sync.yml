name: SkillBridge Events Synchronization

on:
  schedule:
    # Runs every 6 hours at minute 0
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      space_url:
        description: 'Optional custom Space URL to sync'
        required: false
        default: ''

jobs:
  sync-events:
    name: Sync External Events
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Events Sync Endpoint
        run: |
          TARGET_URL="${{ inputs.space_url || secrets.SPACE_URL || 'https://akanik-skillbridge-ai.hf.space' }}"
          # Clean trailing slash if present
          TARGET_URL="${TARGET_URL%/}"
          SYNC_ENDPOINT="${TARGET_URL}/api/events/sync"

          echo "Initiating synchronization against: ${SYNC_ENDPOINT}"

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SYNC_ENDPOINT}" \
            -H "X-Sync-Token: ${{ secrets.EVENTS_SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            --connect-timeout 30 \
            --max-time 180)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "Response HTTP Status: ${HTTP_STATUS}"
          echo "Response Body: ${HTTP_BODY}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Events synchronization failed with status ${HTTP_STATUS}"
            exit 1
          fi

          echo "Events synchronization completed successfully."
